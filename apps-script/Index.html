<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hồ sơ • Hợp Thịnh</title>
<style>
:root{--ink:#153f3a;--brand:#187b65;--bg:#f4f6f3;--line:#dce5df;--muted:#60736e;--red:#b13f35;--amber:#946916}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#183831;font:14px/1.55 system-ui,-apple-system,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:white;border-radius:8px;padding:9px 13px;color:var(--ink)}button:hover{border-color:var(--brand);background:#edf5f0}button:disabled{opacity:.5;cursor:wait}.primary{background:var(--brand);color:white;border-color:var(--brand)}.primary:hover{background:var(--ink);color:white}.danger{color:var(--red)}header{background:var(--ink);color:white;padding:20px 32px;display:flex;align-items:center;justify-content:space-between;gap:15px}header h1{font-size:21px;margin:0}header small{color:#bdd8cb}header button{background:transparent;color:white;border-color:#50746b}nav{background:white;display:flex;gap:6px;padding:12px 32px;border-bottom:1px solid var(--line);overflow:auto}nav button{white-space:nowrap;border-color:transparent}nav button.active{background:#e5f1e9;color:var(--brand);font-weight:700}main{max-width:1500px;margin:0 auto;padding:26px 32px}.topline,.toolbar,.actions{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}h2{font-size:22px;margin:0 0 6px}h3{font-size:17px;margin:0 0 12px}p{margin:7px 0}.muted{color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:22px 0}.card,.panel{background:white;border:1px solid var(--line);border-radius:12px;padding:18px}.card span{display:block;color:var(--muted)}.card b{font-size:32px;display:block;margin-top:7px}.card button{margin-top:8px;padding:4px 8px;font-size:12px}.red{color:var(--red)}.amber{color:var(--amber)}.grid{display:grid;grid-template-columns:1.3fr 1fr;gap:18px}.panel{margin:16px 0}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{text-align:left;padding:11px 10px;border-bottom:1px solid #edf1ed;font-size:13px}th{background:#f7f9f6;color:var(--muted);font-size:12px}td.wrap{white-space:normal;min-width:160px}.badge{display:inline-block;padding:3px 8px;background:#edf3ef;color:var(--ink);border-radius:6px;font-size:12px}.badge.OVERDUE,.badge.BLOCKED{background:#fce9e5;color:var(--red)}.badge.TODAY,.badge.SOON,.badge.PENDING{background:#fff3d9;color:var(--amber)}.badge.UNVERIFIED,.badge.UNKNOWN{background:#edf0f4;color:#617084}.barrow{display:grid;grid-template-columns:170px 1fr 40px;align-items:center;gap:10px;margin:11px 0}.bar{height:10px;background:#edf2ed;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--brand);border-radius:6px}.filters{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}.filters input,.filters select{width:auto;min-width:130px;max-width:240px}.notice{border-left:4px solid #caa55a;background:#fff8e8;padding:12px 16px;border-radius:5px;margin:14px 0}.empty{padding:32px;text-align:center;color:var(--muted)}.link{border:0;background:transparent;color:var(--brand);padding:0;text-decoration:underline;text-align:left}.link:hover{background:transparent}dialog{border:1px solid var(--line);border-radius:14px;padding:0;width:min(850px,95vw);max-height:90vh;color:var(--ink)}dialog::backdrop{background:#112f2a88}.dialoghead{display:flex;justify-content:space-between;align-items:center;padding:17px 22px;border-bottom:1px solid var(--line)}.dialogbody{padding:20px 22px;overflow:auto;max-height:76vh}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;font-size:13px;color:var(--muted)}input,select,textarea{display:block;width:100%;border:1px solid #cbd8cf;border-radius:7px;padding:9px 10px;margin-top:5px;background:white;color:#183831}textarea{min-height:80px;resize:vertical}.wide{grid-column:1/-1}input[type=checkbox]{display:inline-block;width:auto}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;background:#f4f6f3;padding:12px;border-radius:7px}.footer{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}#toast{position:fixed;bottom:20px;right:24px;max-width:min(550px,90vw);padding:14px 20px;border:1px solid #bdd3c7;border-radius:10px;background:#153f3a;color:white;z-index:20;display:none}#loading{font-size:12px;color:#c6dccf}.detailgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.timeline{border-left:2px solid var(--line);padding-left:15px;margin:14px}.timeline p{font-size:13px}.pagination{display:flex;justify-content:flex-end;gap:12px;align-items:center;margin-top:12px}a{color:var(--brand)}.error{color:var(--red);white-space:pre-wrap}.demo{background:#fff3d9;text-align:center;padding:7px;color:#76531a}.small{font-size:12px}@media(max-width:800px){main{padding:18px 14px}header,nav{padding:14px}.cards{grid-template-columns:repeat(2,1fr)}.grid,.formgrid,.detailgrid{grid-template-columns:1fr}.wide{grid-column:auto}.barrow{grid-template-columns:120px 1fr 30px}header h1{font-size:18px}}
</style></head><body>
<header><div><small>BỘ PHẬN MỘT CỬA · CHUYÊN MÔN</small><h1>Theo dõi hồ sơ · Hợp Thịnh</h1></div><div><span id="loading"></span><span id="account">Đang xác thực…</span> <button id="logoutButton" style="display:none" onclick="logout()">Kết thúc phiên</button> <button onclick="load()">↻ Tải lại</button></div></header>
<nav id="nav"></nav><main id="main"><div class="panel">Đang kết nối sổ hồ sơ…</div></main>
<dialog id="modal"><div class="dialoghead"><h3 id="modalTitle"></h3><button onclick="closeModal()" aria-label="Đóng">✕</button></div><div class="dialogbody" id="modalBody"></div></dialog><div id="toast" role="status"></div>
<script>
'use strict';
const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LABEL={NEW:'Chờ đọc',SUBMITTED:'Đang đọc',RETRY:'Chờ thử lại',FAILED:'Đọc thất bại',REVIEW:'Chờ duyệt',RESOLVED:'Đã đối soát',UNVERIFIED:'Chưa xác minh',MERGED:'Đã hợp nhất',RECEIVED:'Đã tiếp nhận',TRANSFER_WAIT:'Chờ chuyên môn nhận',PROCESSING:'Đang xử lý',RESULT_READY:'Có kết quả chuyên môn',RETURN_WAIT:'Chờ một cửa nhận kết quả',FRONT_READY:'Chờ trả công dân',CLOSED:'Đã đóng',UNKNOWN:'Chưa xác định hạn',OVERDUE:'Quá hạn',TODAY:'Đến hạn hôm nay',SOON:'Sắp đến hạn',ON_TIME:'Trong hạn',TODO:'Chưa bắt đầu',DOING:'Đang làm',BLOCKED:'Đang chờ',DONE:'Hoàn thành',CANCELLED:'Đã hủy',PENDING:'Chờ nhận',ACCEPTED:'Đã nhận',REJECTED:'Không nhận',APPROVED:'Cấp kết quả',REFUSED:'Từ chối',WITHDRAWN:'Công dân rút',ADMIN:'Quản trị',MANAGER:'Quản lý',FRONT:'Một cửa',SPECIALIST:'Chuyên môn',create:'Tiếp nhận',handoff:'Bàn giao chuyên môn',accept_transfer:'Xác nhận nhận',reject_transfer:'Không nhận bàn giao',assign_task:'Giao việc',update_task:'Cập nhật công việc',record_result:'Ghi kết quả',return_result:'Bàn giao kết quả',close:'Trả công dân',adjust_due:'Điều chỉnh hạn',reopen:'Mở lại',verify_case:'Xác minh dữ liệu cũ',approve_pdf:'Duyệt PDF',add_payment:'Ghi biên lai',add_document:'Gắn tài liệu',add_parcel:'Thêm thửa đất',merge_legacy:'Hợp nhất bản trùng'};
let SESSION='';try{SESSION=sessionStorage.getItem('hoso_session')||'';}catch{}
let DATA=null,TAB='overview',FILTER={},PAGE=0,BUSY=0,DETAIL=null,IMPORTING=false;
function badge(v){return '<span class="badge '+esc(v)+'">'+esc(LABEL[v]||v)+'</span>';}
function person(email){return DATA?.users.find(u=>u.email===email)?.name||email||'Chưa phân công';}
function proc(id){return DATA?.procedures.find(p=>p.id===id)?.name||id||'Chưa đối soát';}
function fmt(d){return /^\d{4}-\d{2}-\d{2}$/.test(d||'')?d.split('-').reverse().join('/'):esc(d||'—');}
function req(action,input={}){return {action,input,sessionToken:SESSION,requestId:crypto.randomUUID()};}
function rpc(request){BUSY++;$('loading').textContent='Đang xử lý… ';return new Promise((resolve,reject)=>{
  const done=fn=>v=>{BUSY--;$('loading').textContent=BUSY?'Đang xử lý… ':'';fn(v);};
  if(window.google?.script?.run)google.script.run.withSuccessHandler(done(resolve)).withFailureHandler(done(e=>reject(new Error(e.message||e)))).api(request);
  else if(location.hostname==='127.0.0.1'||location.hostname==='localhost')fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(request)}).then(async r=>{let v=await r.json();if(!r.ok)throw new Error(v.error||'Lỗi máy chủ');return v;}).then(done(resolve),done(reject));
  else done(reject)(new Error('Mở giao diện qua bản triển khai Apps Script.'));
});}
function toast(message){$('toast').textContent=message;$('toast').style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('toast').style.display='none',7000);}
function showModal(title,html){$('modalTitle').textContent=title;$('modalBody').innerHTML=html;if(!$('modal').open)$('modal').showModal();}
function closeModal(){$('modal').close();}
function option(v,label,selected=''){return '<option value="'+esc(v)+'" '+(v===selected?'selected':'')+'>'+esc(label)+'</option>';}
function selectOptions(values,selected){return values.map(v=>option(v,LABEL[v]||v,selected)).join('');}
function userOptions(roles){return DATA.users.filter(u=>!roles||roles.includes(u.role)).map(u=>option(u.email,u.name+' · '+(LABEL[u.role]||u.role))).join('');}
function procedureOptions(){return DATA.procedures.filter(p=>p.active).map(p=>option(p.id,p.name)).join('');}
function field(name,label,type='text',value='',required=true,extra=''){return '<label>'+esc(label)+'<input name="'+esc(name)+'" type="'+type+'" value="'+esc(value)+'" '+(required?'required':'')+' '+extra+'></label>';}
function select(name,label,options){return '<label>'+esc(label)+'<select name="'+esc(name)+'" required>'+options+'</select></label>';}
function area(name,label,value='',required=true){return '<label class="wide">'+esc(label)+'<textarea name="'+esc(name)+'" '+(required?'required':'')+'>'+esc(value)+'</textarea></label>';}
async function load(){try{DATA=await rpc(req('bootstrap',FILTER));$('account').textContent=DATA.user.name+' · '+LABEL[DATA.user.role];$('logoutButton').style.display=SESSION?'inline-block':'none';render();}catch(e){DATA=null;$('nav').innerHTML='';if(/email|tài khoản|đăng nhập|phân quyền/i.test(e.message)){showLogin(e.message);return;}$('main').innerHTML='<div class="panel"><h2>Chưa kết nối được sổ hồ sơ</h2><p class="error">'+esc(e.message)+'</p><p>Quản trị viên cần khởi tạo ứng dụng và phân quyền email. Không gửi mật khẩu hoặc khóa API qua biểu mẫu này.</p></div>';}}
function setSession(token){SESSION=token;try{if(token)sessionStorage.setItem('hoso_session',token);else sessionStorage.removeItem('hoso_session');}catch{}}
function showLogin(message=''){closeModal();$('account').textContent='Chưa đăng nhập';$('main').innerHTML='<section class="panel" style="max-width:550px;margin:40px auto"><h2>Đăng nhập cán bộ</h2><p class="muted">Dùng email đã được quản trị viên phân quyền. Không nhập mật khẩu Google.</p><p class="error">'+esc(message)+'</p><form id="loginEmailForm"><label>Email<input id="loginEmail" type="email" required autocomplete="email"></label><button class="primary" id="loginSend" style="margin-top:16px">Nhận mã đăng nhập</button></form><form id="loginCodeForm" style="display:none"><label>Mã 6 chữ số từ email<input id="loginCode" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autocomplete="one-time-code"></label><button class="primary" style="margin-top:16px">Đăng nhập</button></form><p id="loginMessage" role="status"></p></section>';$('loginEmailForm').onsubmit=async e=>{e.preventDefault();$('loginSend').disabled=true;try{const r=await rpc(req('login_begin',{email:$('loginEmail').value}));window.loginChallenge=r.challenge;$('loginMessage').textContent=r.message;$('loginCodeForm').style.display='block';}catch(err){$('loginMessage').textContent=err.message;}finally{$('loginSend').disabled=false;}};$('loginCodeForm').onsubmit=async e=>{e.preventDefault();try{const r=await rpc(req('login_verify',{challenge:window.loginChallenge,code:$('loginCode').value}));setSession(r.token);await load();}catch(err){$('loginMessage').textContent=err.message;}};}
async function logout(){try{await rpc(req('logout'));}catch{}setSession('');DATA=null;$('nav').innerHTML='';showLogin('Phiên mã email đã kết thúc.');}
function setTab(t){TAB=t;PAGE=0;render();}
function render(){const tabs=[['overview','Tổng quan'],['cases','Sổ hồ sơ'],['tasks','Công việc'],['transfers','Bàn giao'],['staff','Tiến độ cán bộ']];if(['ADMIN','FRONT','MANAGER'].includes(DATA.user.role))tabs.push(['reviews','Đối soát & PDF']);if(DATA.user.role==='ADMIN')tabs.push(['admin','Quản trị']);
 $('nav').innerHTML=tabs.map(([id,label])=>'<button class="'+(TAB===id?'active':'')+'" onclick="setTab(\''+id+'\')">'+label+'</button>').join('');
 ({overview:overview,cases:casesView,tasks:tasksView,transfers:transfersView,staff:staffView,reviews:reviewsView,admin:adminView}[TAB]||overview)();}
function filters(){return '<div class="filters"><input id="search" placeholder="Mã hồ sơ, tên, điện thoại" value="'+esc(FILTER.q||'')+'" onkeydown="if(event.key===\'Enter\')applyFilters()"><select id="filterOwner">'+option('','Tất cả cán bộ')+DATA.users.map(u=>option(u.email,u.name,FILTER.owner)).join('')+'</select><select id="filterProcedure">'+option('','Tất cả thủ tục')+DATA.procedures.map(p=>option(p.id,p.name,FILTER.procedure)).join('')+'</select><select id="filterStatus">'+option('','Tất cả trạng thái')+selectOptions(['UNVERIFIED','MERGED','RECEIVED','TRANSFER_WAIT','PROCESSING','RESULT_READY','RETURN_WAIT','FRONT_READY','CLOSED'],FILTER.status)+'</select><select id="filterDue">'+option('','Tất cả thời hạn')+selectOptions(['OVERDUE','TODAY','SOON','ON_TIME','UNKNOWN'],FILTER.dueState)+'</select><button onclick="applyFilters()">Lọc</button><button onclick="clearFilters()">Xóa lọc</button></div>';}
function applyFilters(){FILTER={...FILTER,q:$('search').value,owner:$('filterOwner').value,procedure:$('filterProcedure').value,status:$('filterStatus').value,dueState:$('filterDue').value};PAGE=0;load();}
function clearFilters(){FILTER={};PAGE=0;load();}
function filterCard(type,value){FILTER={};FILTER[type]=value;TAB='cases';PAGE=0;load();}
function caseTable(rows){return '<div class="scroll"><table><thead><tr><th>Mã hồ sơ</th><th>Người nộp</th><th>Thủ tục</th><th>Phụ trách</th><th>Hạn hẹn</th><th>Trạng thái</th><th>Thời hạn</th></tr></thead><tbody>'+rows.map(c=>'<tr><td><button class="link" onclick="openCase(\''+esc(c.id)+'\')">'+esc(c.code||c.id)+'</button></td><td>'+esc(c.name)+'</td><td class="wrap">'+esc(proc(c.procedure))+'</td><td>'+esc(person(c.owner))+'</td><td>'+fmt(c.due)+'</td><td>'+badge(c.status)+'</td><td>'+badge(c.dueState||'UNKNOWN')+'</td></tr>').join('')+'</tbody></table>'+(rows.length?'':'<div class="empty">Không có hồ sơ trong nhóm này.</div>')+'</div>';}
function overview(){let d=DATA.dashboard,c=d.counts;const cards=[['Đang theo dõi',c.active,'status','PROCESSING',''],['Quá hạn',c.overdue,'dueState','OVERDUE','red'],['Đến hạn hôm nay',c.today,'dueState','TODAY','amber'],['Sắp đến hạn',c.soon,'dueState','SOON','amber'],['Chờ nhận bàn giao',c.waitingTransfer,'tab','transfers',''],['Chờ trả công dân',c.readyReturn,'status','FRONT_READY',''],['Chưa xác định hạn',c.unknownDue,'dueState','UNKNOWN',''],['Lịch sử chưa xác minh',c.unverified,'status','UNVERIFIED','']];
 let counts={};DATA.cases.filter(x=>x.status!=='UNVERIFIED').forEach(x=>counts[x.status]=(counts[x.status]||0)+1);let max=Math.max(1,...Object.values(counts));
 $('main').innerHTML='<div class="topline"><div><h2>Tổng quan hồ sơ</h2><p class="muted">Ngày '+fmt(DATA.today)+' · Kỳ báo cáo '+fmt(d.from)+' – '+fmt(d.to)+'</p></div><button class="primary" onclick="newCase()">+ Tiếp nhận hồ sơ</button></div>'+filters()+'<div class="cards">'+cards.map(([label,n,type,value,color])=>'<div class="card"><span>'+label+'</span><b class="'+color+'">'+n+'</b>'+(label==='Đang theo dõi'?'<button onclick="setTab(\'cases\')">Mở sổ hồ sơ →</button>':type==='tab'?'<button onclick="setTab(\''+value+'\')">Xem danh sách →</button>':'<button onclick="filterCard(\''+type+'\',\''+value+'\')">Xem danh sách →</button>')+'</div>').join('')+'</div><div class="grid"><section class="panel"><h3>Hồ sơ theo trạng thái</h3>'+Object.entries(counts).map(([s,n])=>'<div class="barrow"><span>'+esc(LABEL[s])+'</span><div class="bar"><i style="width:'+n/max*100+'%"></i></div><b>'+n+'</b></div>').join('')+(Object.keys(counts).length?'':'<p class="muted">Chưa có hồ sơ đã xác minh.</p>')+'</section><section class="panel"><h3>Biến động trong kỳ</h3><p>Tồn đầu kỳ theo nhật ký: <b>'+d.period.opening+'</b></p><p>Tiếp nhận mới: <b>'+d.period.intakes+'</b></p><p>Xác minh hồ sơ lịch sử: <b>'+d.period.verifiedLegacy+'</b></p><p>Bổ sung tồn từ lịch sử đã xác minh: <b>'+d.period.verifiedOpen+'</b></p><p>Tồn cuối kỳ theo nhật ký: <b>'+d.period.ending+'</b></p><p>Có kết quả chuyên môn: <b>'+d.period.results+'</b></p><p>Trả công dân / đóng: <b>'+d.period.closed+'</b></p><p>Mở lại: <b>'+d.period.reopened+'</b></p><p>Lượt hoàn thành công việc: <b>'+d.period.taskCompletions+'</b></p><p class="muted small">Số liệu kỳ theo nhật ký; dữ liệu cũ chưa có lịch sử không được dựng lại.</p><button onclick="periodForm()">Chọn kỳ / chốt báo cáo</button> <button onclick="snapshotsForm()">Báo cáo đã chốt</button></section></div><div class="notice">'+esc(d.note)+'</div><section class="panel"><h3>Cần kiểm tra hôm nay</h3>'+caseTable(DATA.cases.filter(c=>['OVERDUE','TODAY'].includes(c.dueState)||c.status==='FRONT_READY').slice(0,20))+'</section>';}
function casesView(){$('main').innerHTML='<div class="topline"><div><h2>Sổ hồ sơ thống nhất</h2><p class="muted">'+DATA.cases.length+' hồ sơ theo bộ lọc hiện tại</p></div><div class="actions"><button onclick="exportCases()">Xuất CSV</button><button class="primary" onclick="newCase()">+ Tiếp nhận</button></div></div>'+filters()+'<section class="panel">'+caseTable(DATA.cases.slice(PAGE*40,(PAGE+1)*40))+'<div class="pagination"><button onclick="PAGE=Math.max(0,PAGE-1);casesView()" '+(PAGE?'':'disabled')+'>Trước</button><span>Trang '+(PAGE+1)+' / '+Math.max(1,Math.ceil(DATA.cases.length/40))+'</span><button onclick="PAGE++;casesView()" '+((PAGE+1)*40<DATA.cases.length?'':'disabled')+'>Sau</button></div></section>';}
function tasksView(){$('main').innerHTML='<h2>Công việc</h2><p class="muted">Giao việc trong chi tiết hồ sơ. Hạn công việc tách riêng hạn hẹn trả kết quả.</p><section class="panel"><div class="scroll"><table><thead><tr><th>Công việc</th><th>Hồ sơ</th><th>Người làm</th><th>Hạn nội bộ</th><th>Trạng thái</th><th>Vướng mắc / bước tiếp</th><th></th></tr></thead><tbody>'+DATA.tasks.map(t=>'<tr><td class="wrap">'+esc(t.title)+'</td><td><button class="link" onclick="openCase(\''+esc(t.caseId)+'\')">'+esc(DATA.cases.find(c=>c.id===t.caseId)?.code||t.caseId)+'</button></td><td>'+esc(person(t.assignee))+'</td><td class="'+(t.due<DATA.today&&!['DONE','CANCELLED'].includes(t.status)?'red':'')+'">'+fmt(t.due)+'</td><td>'+badge(t.status)+'</td><td class="wrap">'+esc(t.blocker||t.nextStep||t.result)+'</td><td><button onclick="taskForm(\''+esc(t.id)+'\')">Cập nhật</button></td></tr>').join('')+'</tbody></table></div>'+(DATA.tasks.length?'':'<div class="empty">Chưa có công việc.</div>')+'</section>';}

function staffView(){const rows=DATA.dashboard.staff;$('main').innerHTML='<div class="topline"><div><h2>Tiến độ làm việc của cán bộ</h2><p class="muted">Kỳ '+fmt(DATA.dashboard.from)+' – '+fmt(DATA.dashboard.to)+' · Không xếp hạng bằng số lượng đơn thuần.</p></div><button onclick="periodForm()">Đổi kỳ báo cáo</button></div><section class="panel"><div class="scroll"><table><thead><tr><th>Cán bộ</th><th>Vai trò</th><th>Hồ sơ phụ trách</th><th>Việc đang mở</th><th>Việc quá hạn</th><th>Đang chờ</th><th>Hoàn thành trong kỳ</th><th>Trong hạn nội bộ</th><th>Chờ nhận</th><th>Hồ sơ ≥7 ngày chưa cập nhật</th></tr></thead><tbody>'+rows.map(u=>'<tr><td>'+esc(u.name)+'</td><td>'+badge(u.role)+'</td><td>'+u.cases+'</td><td>'+u.open+'</td><td class="red">'+u.overdue+'</td><td>'+u.blocked+'</td><td>'+u.done+'</td><td>'+u.onTime+'</td><td>'+u.waitingReceive+'</td><td>'+u.staleCases+'</td></tr>').join('')+'</tbody></table></div></section><div class="notice">Công việc bị chặn vẫn có hạn và cần cập nhật nguyên nhân. Việc đang chờ không tự làm dừng hạn chính thức.</div>';}
async function openCase(id){try{DETAIL=await rpc(req('detail',{caseId:id}));caseDetail();}catch(e){toast(e.message);}}
function caseDetail(){const d=DETAIL,c=d.case;const buttons=[];const role=DATA.user.role,handle=['ADMIN','MANAGER'].includes(role)||c.owner===DATA.user.email;if(c.status==='UNVERIFIED'&&['ADMIN','FRONT'].includes(role))buttons.push(['verify_case','Xác minh dữ liệu cũ']);if(c.status==='UNVERIFIED'&&role==='ADMIN')buttons.push(['merge_legacy','Hợp nhất bản trùng']);if(['RECEIVED','PROCESSING'].includes(c.status)&&handle){buttons.push(['handoff','Bàn giao chuyên môn']);if(['ADMIN','MANAGER','SPECIALIST'].includes(role))buttons.push(['assign_task','Giao công việc']);}if(['TRANSFER_WAIT','RETURN_WAIT'].includes(c.status)&&d.transfers.some(t=>t.id===c.pendingTransfer&&t.to===DATA.user.email))buttons.push(['accept_transfer','Xác nhận nhận'],['reject_transfer','Không nhận / yêu cầu làm rõ']);if(c.status==='PROCESSING'&&handle)buttons.push(['record_result','Ghi kết quả chuyên môn']);if(c.status==='RESULT_READY'&&handle)buttons.push(['return_result','Bàn giao về một cửa']);if(c.status==='FRONT_READY'&&handle&&['ADMIN','FRONT'].includes(role))buttons.push(['close','Trả công dân']);if(c.status==='CLOSED'&&['ADMIN','MANAGER'].includes(role))buttons.push(['reopen','Mở lại']);if(handle&&(!['CLOSED','UNVERIFIED'].includes(c.status)||['ADMIN','MANAGER'].includes(role)))buttons.push(['add_parcel','Thêm thửa đất']);if(['ADMIN','MANAGER'].includes(role)&&c.status!=='CLOSED')buttons.push(['adjust_due','Điều chỉnh hạn']);if(['ADMIN','FRONT'].includes(role))buttons.push(['add_payment','Ghi biên lai']);if(handle)buttons.push(['add_document','Gắn tài liệu Drive']);
 showModal(c.code||c.id,'<div class="topline"><h3>'+esc(c.name)+'</h3>'+badge(c.status)+'</div><div class="detailgrid"><p>Thủ tục: '+esc(proc(c.procedure))+'</p><p>Phụ trách: '+esc(person(c.owner))+'</p><p>Ngày nhận: '+fmt(c.received)+'</p><p>Hạn gốc / hiện hành: '+fmt(c.originalDue)+' / '+fmt(c.due)+'</p><p>Điện thoại: '+esc(c.phone||'—')+'</p><p>Địa chỉ: '+esc(c.address||'—')+'</p><p>Kết quả: '+esc(LABEL[c.outcome]||'Chưa có')+'</p><p>Ngày trả: '+fmt(c.returnDate)+'</p></div><div class="actions" style="justify-content:flex-start">'+buttons.map(([a,l])=>'<button onclick="actionForm(\''+a+'\')">'+l+'</button>').join('')+'</div><p class="small muted">Mỗi thay đổi lưu người thực hiện và thời điểm trong lịch sử.</p><h3 style="margin-top:20px">Thửa đất</h3><pre>'+esc(d.parcels.map(p=>['Thửa '+p.plot,'Tờ '+p.map,p.area+' m²',p.village,p.serial].join(' · ')).join('\n')||'Chưa có thông tin')+'</pre><h3>Công việc</h3>'+d.tasks.map(t=>'<p>'+badge(t.status)+' '+esc(t.title)+' · '+esc(person(t.assignee))+' · '+fmt(t.due)+' <button onclick="taskForm(\''+esc(t.id)+'\')">Cập nhật</button></p>').join('')+'<h3 style="margin-top:18px">Tài liệu và khoản thu</h3>'+d.documents.map(x=>'<p><button class="link" onclick="openDocument(\''+esc(x.fileId)+'\')">'+esc(x.name)+'</button> · '+esc(x.type)+'</p>').join('')+d.payments.map(x=>'<p>'+esc(x.receipt)+' · '+Number(x.amount).toLocaleString('vi-VN')+' VND · '+fmt(x.date)+'</p>').join('')+'<h3 style="margin-top:18px">Lịch sử</h3>'+d.events.slice().reverse().map(e=>'<div class="timeline"><p><b>'+esc(LABEL[e.action]||e.action)+'</b> · '+esc(e.at)+'</p><p class="muted">'+esc(e.actor)+'</p>'+(e.input.reason?'<p>'+esc(e.input.reason)+'</p>':'')+'</div>').join(''));}
function form(title,html,onSubmit){showModal(title,'<form id="actionForm"><div class="formgrid">'+html+'</div><p id="formError" class="error"></p><div class="footer"><button type="button" onclick="closeModal()">Đóng</button><button id="submitAction" class="primary">Lưu và ghi nhật ký</button></div></form>');$('actionForm').onsubmit=async event=>{event.preventDefault();$('submitAction').disabled=true;$('formError').textContent='';try{await onSubmit(Object.fromEntries(new FormData(event.target)));}catch(e){$('formError').textContent=e.message;if($('submitAction'))$('submitAction').disabled=false;}};}
async function saveAction(action,input){const result=await rpc(req(action,input));closeModal();toast(result.message||'Đã ghi nhận.');await load();if(result.caseId)await openCase(result.caseId);}

function newCase(){form('Tiếp nhận hồ sơ',intakeFields()+field('plot','Số thửa (giữ nguyên nếu là nhóm thửa)','text','',false)+field('map','Số tờ','text','',false)+field('area','Diện tích m²','number','',false,'step="any" min="0"')+field('village','Thôn','text','',false)+field('serial','Sê-ri GCN','text','',false),p=>{p.parcels=p.plot||p.map?[{plot:p.plot,map:p.map,area:p.area,village:p.village,serial:p.serial}]:[];return saveAction('create',p);});}
function actionForm(action){const c=DETAIL.case;let html='';
 if(action==='handoff'||action==='return_result')html=select('to','Người nhận',userOptions(action==='handoff'?['SPECIALIST','MANAGER']:['FRONT']))+area('note','Thành phần hồ sơ / nội dung bàn giao');

 if(action==='reject_transfer')html=area('reason','Lý do không nhận / yêu cầu làm rõ');

 if(action==='record_result')html=select('outcome','Loại kết quả',selectOptions(['APPROVED','REFUSED','WITHDRAWN']))+field('resultDate','Ngày có kết quả','date',DATA.today)+area('evidence','Số văn bản / căn cứ / tài liệu kết quả');

 if(action==='adjust_due')html=field('due','Hạn hiện hành mới','date',c.due)+area('reason','Lý do điều chỉnh')+area('evidence','Văn bản làm căn cứ điều chỉnh hạn');
 if(action==='reopen')html=select('owner','Người tiếp nhận hồ sơ mở lại',userOptions(['FRONT']))+area('reason','Lý do mở lại');

 if(action==='merge_legacy')html=field('targetId','ID hồ sơ đích giữ lại')+area('reason','Căn cứ xác nhận hai bản ghi là cùng một hồ sơ');
 if(action==='add_parcel')html=field('plot','Số thửa')+field('map','Số tờ')+field('area','Diện tích m²','number','',false,'step="any" min="0"')+field('village','Thôn','text','',false)+field('commune','Xã','text','',false)+field('serial','Sê-ri GCN','text','',false)+area('evidence','Nguồn/căn cứ thửa đất');
 if(action==='add_document')html=field('fileId','Drive file ID')+field('name','Tên tài liệu')+field('type','Loại tài liệu');
 if(action==='add_payment')html=field('receipt','Số biên lai')+field('date','Ngày biên lai','date',DATA.today)+field('amount','Số tiền VND','number','',true,'min="1" step="1"')+field('type','Loại khoản thu')+area('evidence','Căn cứ / tài liệu biên lai');
 form(LABEL[action]||action,html,async p=>{if(action==='merge_legacy'){const t=await rpc(req('detail',{caseId:p.targetId}));p.targetVersion=t.case.version;}if(action==='verify_case')p.legacyClosed=p.legacyClosed==='true';return saveAction(action,{...p,caseId:c.id,version:c.version});});}
async function acceptTransfer(id){await openCase(id);if(DETAIL?.case.id===id)actionForm('accept_transfer');}
async function taskForm(id){const task=DATA.tasks.find(t=>t.id===id)||DETAIL?.tasks.find(t=>t.id===id);if(!task)return;const detail=await rpc(req('detail',{caseId:task.caseId}));form('Cập nhật: '+task.title,select('status','Trạng thái',selectOptions(['TODO','DOING','BLOCKED','DONE','CANCELLED'],task.status))+area('blocker','Lý do đang chờ',task.blocker,false)+area('nextStep','Bước tiếp theo',task.nextStep,false)+area('result','Kết quả hoặc lý do hủy',task.result,false),p=>saveAction('update_task',{...p,caseId:task.caseId,version:detail.case.version,taskId:id}));}
function batchForm(){const eligible=DATA.cases.filter(c=>['RECEIVED','PROCESSING','RESULT_READY'].includes(c.status));form('Bàn giao theo đợt',select('kind','Loại bàn giao',option('handoff','Giao chuyên môn')+option('return_result','Giao kết quả về một cửa'))+select('to','Người nhận',userOptions())+area('note','Thành phần / nội dung bàn giao')+'<label class="wide">Chọn hồ sơ<select name="ids" id="batchIds" multiple size="8">'+eligible.map(c=>option(c.id,(c.code||c.id)+' · '+c.name+' · '+LABEL[c.status])).join('')+'</select></label>',async p=>{const ids=[...$('batchIds').selectedOptions].map(o=>o.value);if(!ids.length)throw new Error('Chọn ít nhất một hồ sơ.');const batchId=crypto.randomUUID();let n=0;for(const id of ids){const c=DATA.cases.find(c=>c.id===id);try{await rpc(req(p.kind,{caseId:id,version:c.version,to:p.to,note:p.note,batchId}));n++;}catch(e){await load();throw new Error('Đã giao '+n+'/'+ids.length+' hồ sơ. Dừng tại '+(c.code||id)+': '+e.message);}}closeModal();toast('Đã giao '+n+' hồ sơ. Bên nhận cần xác nhận từng hồ sơ.');await load();});}
function periodForm(){form('Kỳ báo cáo',field('from','Từ ngày','date',DATA.dashboard.from)+field('to','Đến ngày','date',DATA.dashboard.to)+select('mode','Thao tác',option('filter','Xem theo kỳ')+(['ADMIN','MANAGER'].includes(DATA.user.role)?option('snapshot','Chốt bản báo cáo bất biến'):'')),async p=>{if(p.from>p.to)throw new Error('Ngày bắt đầu sau ngày kết thúc.');if(p.mode==='snapshot')toast((await rpc(req('snapshot',p))).message);FILTER.from=p.from;FILTER.to=p.to;closeModal();await load();});}
function reviewsView(){const reviews=DATA.reviews.filter(x=>x.status==='OPEN');$('main').innerHTML='<div class="topline"><div><h2>Đối soát dữ liệu & đọc PDF</h2><p class="muted">'+reviews.length+' mục đang chờ duyệt. Dữ liệu AI chưa tự ghi vào sổ.</p></div><div class="actions"><button onclick="uploadForm()">+ Tải phiếu PDF</button><button onclick="runUtility(\'scan_pdf\')">Quét thư mục Drive</button><button onclick="runUtility(\'poll_pdf\')">Kiểm tra tác vụ PDF</button></div></div><section class="panel"><h3>Tác vụ PDF</h3><div class="scroll"><table><thead><tr><th>ID</th><th>Trạng thái</th><th>Cập nhật</th><th>Thông tin</th></tr></thead><tbody>'+DATA.jobs.slice(-30).reverse().map(j=>'<tr><td>'+esc(j.id.slice(0,16))+'</td><td>'+badge(j.status)+'</td><td>'+esc(j.updatedAt)+'</td><td class="wrap">'+esc(j.message)+(j.status==='FAILED'?' <button onclick="retryPdf(\''+esc(j.id)+'\')">Thử lại</button>':'')+'</td></tr>').join('')+'</tbody></table></div></section><section class="panel"><h3>Hàng chờ duyệt</h3><div class="scroll"><table><thead><tr><th>Loại</th><th>Hồ sơ / nguồn</th><th>Nội dung cần kiểm tra</th><th></th></tr></thead><tbody>'+reviews.slice(PAGE*40,(PAGE+1)*40).map(v=>'<tr><td>'+esc(({LEGACY_SOURCE:'Nguồn dữ liệu cũ',SPECIALIST_MATCH:'Đối chiếu chuyên môn',UNCLASSIFIED_SOURCE:'Dòng cần phân loại',PDF_EXTRACTION:'PDF chờ duyệt'})[v.kind]||v.kind)+'</td><td class="wrap">'+esc(v.caseId||v.source)+'</td><td class="wrap">'+esc(v.message)+'</td><td><button onclick="reviewForm(\''+esc(v.id)+'\')">Xem / duyệt</button></td></tr>').join('')+'</tbody></table></div><div class="pagination"><button onclick="PAGE=Math.max(0,PAGE-1);reviewsView()" '+(PAGE?'':'disabled')+'>Trước</button><span>Trang '+(PAGE+1)+'</span><button onclick="PAGE++;reviewsView()" '+((PAGE+1)*40<reviews.length?'':'disabled')+'>Sau</button></div></section>';}
function uploadForm(){showModal('Tải phiếu PDF','<p>Tối đa 10 MB. Tệp lưu riêng tư trong Drive, model đọc xong sẽ vào hàng chờ duyệt.</p><input id="pdfFile" type="file" accept="application/pdf"><p id="uploadStatus"></p><button class="primary" id="uploadButton" onclick="uploadPdf()">Tải lên</button>');}
async function uploadPdf(){const f=$('pdfFile').files[0];if(!f)return;if(f.size>10*1024*1024){toast('PDF tối đa 10 MB.');return;}$('uploadButton').disabled=true;try{const bytes=await f.arrayBuffer();let raw='',a=new Uint8Array(bytes);for(let i=0;i<a.length;i+=8192)raw+=String.fromCharCode(...a.subarray(i,i+8192));const r=await rpc(req('upload_pdf',{name:f.name,base64:btoa(raw)}));closeModal();toast(r.message);await load();}catch(e){$('uploadStatus').textContent=e.message;$('uploadButton').disabled=false;}}
function reviewForm(id){const v=DATA.reviews.find(x=>x.id===id);if(v.kind==='PDF_EXTRACTION'){pdfReviewForm(v);return;}form('Đối soát dữ liệu','<pre class="wide">'+esc(JSON.stringify(v,null,2))+'</pre>'+field('caseId','ID hồ sơ liên kết đã đối chiếu (nếu có)','text',v.caseId||'',false)+area('resolution','Kết luận và căn cứ; ghi rõ thao tác tiếp theo'),p=>saveAction('resolve_review',{id,...p}));}
function pdfReviewForm(v){const d=v.draft;form('Kiểm tra dữ liệu đọc từ PDF','<p class="wide"><button type="button" class="link" onclick="openDocument(\''+esc(v.source)+'\')">Mở PDF gốc để đối chiếu</button></p><pre class="wide">'+esc(JSON.stringify(d,null,2))+'</pre>'+select('mode','Cách ghi dữ liệu',option('CREATE','Tạo hồ sơ từ phiếu tiếp nhận')+option('PAYMENT','Ghi khoản thu từ biên lai')+option('DOCUMENT','Chỉ gắn tài liệu')+option('ADJUST_DUE','Điều chỉnh hạn từ văn bản'))+field('caseId','ID hồ sơ đã có (để gắn tài liệu/biên lai)','text','',false)+intakeFields(d.fields||{})+field('receipt','Số biên lai','text',d.fields?.receipt||'',false)+field('date','Ngày biên lai','date',d.fields?.payment_date||'',false)+field('amount','Số tiền VND','number',d.fields?.amount||'',false)+field('type','Loại khoản thu','text',d.fields?.payment_type||'',false)+area('reason','Lý do điều chỉnh hạn','',false),async p=>{let version=0;if(p.mode!=='CREATE'){const detail=await rpc(req('detail',{caseId:p.caseId}));version=detail.case.version;}const data={...p,version};await saveAction('approve_pdf',{reviewId:v.id,mode:p.mode,data});});const fields=$('actionForm');fields.querySelectorAll('[required]').forEach(e=>e.required=false);fields.querySelector('[name=mode]').required=true;}
function adminView(){$('main').innerHTML='<h2>Quản trị</h2><p class="muted">Quản lý tài khoản, danh mục và kích hoạt tích hợp. Khóa không được hiển thị lại.</p><div class="grid"><section class="panel"><h3>Cán bộ và phân quyền</h3>'+DATA.users.map(u=>'<p>'+esc(u.name)+' · '+esc(u.email)+' '+badge(u.role)+'</p>').join('')+'<button onclick="userForm()">Thêm / cập nhật cán bộ</button><h3 style="margin-top:20px">Danh mục thủ tục</h3>'+DATA.procedures.map(p=>'<p>'+esc(p.id)+' · '+esc(p.name)+' '+badge(p.active?'Đang dùng':'Chưa duyệt')+'</p>').join('')+'<button onclick="procedureForm()">Thêm / duyệt thủ tục</button> <button onclick="holidayForm()">Lịch nghỉ / ngày làm bù</button> <button onclick="dueForm()">Tính thử hạn làm việc</button></section><section class="panel"><h3>Tích hợp và nhắc việc</h3><p>Worker: '+(DATA.settings?.workerConfigured?'Đã cấu hình':'Chưa cấu hình')+'</p><p>Email nhắc việc: '+(DATA.settings?.remindersEnabled?'Đã bật':'Đang tắt')+'</p><p>Trigger: '+esc(DATA.settings?.triggers?.join(', ')||'Chưa cài')+'</p><button onclick="settingsForm()">Cấu hình</button> <button onclick="previewReminders()">Xem trước nhắc việc</button><h3 style="margin-top:20px">Dữ liệu và dashboard</h3><button onclick="importForm()">Nhập JSON đã chuẩn hóa</button> <button onclick="runUtility(\'refresh_sheet_dashboard\')">Cập nhật dashboard trong Sheet</button><p><a href="'+esc(DATA.links.sheet||'#')+'" target="_blank" rel="noopener">Mở Google Sheets</a></p><p><a href="'+esc(DATA.links.folder||'#')+'" target="_blank" rel="noopener">Mở thư mục tài liệu Drive</a></p></section></div><section class="panel"><h3>Các kỳ đã chốt</h3>'+DATA.snapshots.map(s=>'<p>'+fmt(s.from)+' – '+fmt(s.to)+' · '+esc(s.actor)+' · '+esc(s.createdAt)+'</p>').join('')+'</section>';}
function userForm(){form('Cán bộ và phân quyền',field('email','Email Google')+field('name','Họ tên')+select('role','Vai trò',selectOptions(['FRONT','SPECIALIST','MANAGER','ADMIN']))+select('active','Trạng thái',option('true','Đang hoạt động')+option('false','Ngừng hoạt động'))+select('notifications','Email nhắc việc',option('false','Tắt')+option('true','Bật cho cán bộ này')),p=>saveAction('save_user',{...p,active:p.active==='true',notifications:p.notifications==='true'}));}
function procedureForm(){form('Danh mục thủ tục',field('id','Mã thủ tục chuẩn')+field('name','Tên thủ tục')+select('active','Đã xác nhận được sử dụng?',option('false','Chưa duyệt')+option('true','Đã duyệt'))+area('rule','Quy tắc hạn / căn cứ / phiên bản áp dụng'),p=>saveAction('save_procedure',{...p,active:p.active==='true'}));}
function holidayForm(){form('Lịch nghỉ / ngày làm bù',field('date','Ngày','date',DATA.today)+select('working','Loại ngày',option('false','Ngày nghỉ')+option('true','Ngày làm việc bù'))+area('note','Tên ngày / căn cứ'),p=>saveAction('save_holiday',{...p,working:p.working==='true'}));}
function settingsForm(){form('Cấu hình tích hợp',field('workerUrl','URL worker HTTPS','url','',false)+field('workerToken','Token worker (để trống nếu giữ nguyên)','password','',false)+select('emailLoginEnabled','Đăng nhập bằng mã email',option('false','Tắt',String(DATA.settings.emailLoginEnabled))+option('true','Bật cho các email đã phân quyền',String(DATA.settings.emailLoginEnabled)))+select('remindersEnabled','Nhắc việc email',option('false','Tắt',String(DATA.settings.remindersEnabled))+option('true','Bật',String(DATA.settings.remindersEnabled)))+select('installTriggers','Trigger tự động',option('false','Giữ nguyên')+option('true','Cài / cập nhật: email mỗi sáng, PDF mỗi 10 phút'))+'<p class="wide muted">URL bỏ trống sẽ giữ cấu hình đang có. Model API key cấu hình ở backend, không nhập vào đây. Email chỉ đến cán bộ đã bật nhận nhắc việc.</p>',p=>{if(!p.workerUrl)delete p.workerUrl;return saveAction('settings',{...p,emailLoginEnabled:p.emailLoginEnabled==='true',remindersEnabled:p.remindersEnabled==='true',installTriggers:p.installTriggers==='true'});});}
async function previewReminders(){try{const list=await rpc(req('notification_preview'));showModal('Xem trước email nhắc việc','<pre>'+esc(JSON.stringify(list,null,2))+'</pre><p>Chưa gửi email. Khi gửi, nội dung chỉ gồm mã và công việc cần kiểm tra.</p><button class="primary" onclick="runUtility(\'send_reminders\')">Gửi theo cấu hình đã bật</button>');}catch(e){toast(e.message);}}
async function retryPdf(id){try{toast((await rpc(req('retry_pdf',{id}))).message);await load();}catch(e){toast(e.message);}}
async function runUtility(action){try{const r=await rpc(req(action));toast(r.message);await load();}catch(e){toast(e.message);}}
function importForm(){showModal('Nhập dữ liệu đã chuẩn hóa','<p><b>Khuyến nghị cho toàn bộ dữ liệu:</b> tải migration.json vào Drive riêng tư, nhập file ID và bấm nhập từ Drive. Hệ thống ghi theo lô lớn, có thể chạy lại an toàn.</p><input id="migrationDriveId" placeholder="Drive file ID của migration.json"><button id="importDriveButton" onclick="importFromDrive()">Nhập từ Drive</button><hr><p>Chọn migration.json do công cụ chuẩn hóa tạo. Chỉ nhập hồ sơ chưa xác minh, thửa và các mục đối soát. Có thể chạy lại, ID cũ được bỏ qua.</p><input id="importFile" type="file" accept="application/json"><p id="importProgress"></p><button class="primary" id="importButton" onclick="importData()">Bắt đầu nhập</button>');}
async function importFromDrive(){const fileId=$('migrationDriveId').value.trim();if(!fileId)return;$('importDriveButton').disabled=true;try{const r=await rpc(req('import_file',{fileId}));closeModal();toast(r.message);await load();}catch(e){toast(e.message);if($('importDriveButton'))$('importDriveButton').disabled=false;}}
async function importData(){if(IMPORTING)return;const file=$('importFile').files[0];if(!file)return;IMPORTING=true;$('importButton').disabled=true;try{const data=JSON.parse(await file.text());if(data.schema!=='hoso-migration-v1'||!Array.isArray(data.records))throw new Error('Không đúng định dạng migration.json.');let i=0;while(i<data.records.length){let batch=[],size=0;while(i<data.records.length&&batch.length<10){let n=JSON.stringify(data.records[i]).length;if(n>30000)throw new Error('Bản ghi quá lớn tại '+i);if(size+n>30000&&batch.length)break;batch.push(data.records[i++]);size+=n;}await rpc(req('import_batch',{records:batch}));if($('importProgress'))$('importProgress').textContent='Đã xử lý '+i+'/'+data.records.length+' bản ghi. Có thể đóng rồi nhập lại nếu bị gián đoạn.';}closeModal();toast('Đã nhập xong. Mở Đối soát để kiểm tra.');await load();}catch(e){if($('importProgress'))$('importProgress').textContent=e.message;if($('importButton'))$('importButton').disabled=false;}finally{IMPORTING=false;}}
function exportCases(){const cols=['id','code','name','phone','procedure','received','due','status','owner'];const cell=v=>'"'+String(/^[=+@-]/.test(String(v||''))?"'"+v:v??'').replace(/"/g,'""')+'"';const csv='\ufeff'+[cols,...DATA.cases.map(c=>cols.map(k=>c[k]))].map(r=>r.map(cell).join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='ho-so.csv';a.click();URL.revokeObjectURL(a.href);}
async function openDocument(fileId){const win=window.open('','_blank');if(!win){toast('Cho phép cửa sổ bật lên để xem PDF.');return;}win.opener=null;win.document.body.textContent='Đang kiểm tra quyền và tải PDF…';try{const data=await rpc(req('read_document',{fileId}));const raw=atob(data.base64),bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);const url=URL.createObjectURL(new Blob([bytes],{type:data.mimeType}));win.location.href=url;setTimeout(()=>URL.revokeObjectURL(url),300000);}catch(e){win.document.body.textContent=e.message;toast(e.message);}}
function snapshotsForm(){showModal('Báo cáo đã chốt',DATA.snapshots.length?DATA.snapshots.map(s=>'<details><summary>'+esc(fmt(s.from)+' – '+fmt(s.to)+' · '+s.createdAt)+'</summary><pre>'+esc(JSON.stringify(s.report,null,2))+'</pre></details>').join(''):'<p>Chưa có báo cáo đã chốt hoặc tài khoản không có quyền xem.</p>');}
function dueForm(){form('Tính thử hạn theo lịch cấu hình',field('start','Ngày bắt đầu','date',DATA.today)+field('days','Số ngày làm việc','number','7',true,'min="1" max="1000" step="1"')+select('includeStart','Ngày bắt đầu',option('false','Không tính ngày bắt đầu')+option('true','Tính nếu là ngày làm việc'))+'<p class="wide muted">Kết quả tham khảo, không tự sửa hạn chính thức. Chỉ áp dụng khi quy tắc thủ tục đã được xác nhận.</p>',async p=>{const r=await rpc(req('calculate_due',{...p,includeStart:p.includeStart==='true'}));closeModal();toast('Ngày tính được: '+fmt(r.due)+'. Chưa ghi vào hồ sơ.');});}
function printTransfers(){const batch=prompt('Mã đợt bàn giao (để trống để in các lượt đang chờ nhận):','');if(batch===null)return;const rows=DATA.transfers.filter(t=>batch?t.batchId===batch:t.status==='PENDING');if(!rows.length){toast('Không có lượt bàn giao phù hợp.');return;}const win=window.open('','_blank');if(!win){toast('Cho phép cửa sổ bật lên để in danh sách.');return;}win.document.write('<!doctype html><html lang="vi"><meta charset="utf-8"><title>Danh sách bàn giao</title><style>body{font:13px Arial;padding:25px}table{border-collapse:collapse;width:100%}td,th{border:1px solid #aaa;padding:8px}small{color:#555}</style><h2>DANH SÁCH BÀN GIAO HỒ SƠ</h2><p>Đợt: '+esc(batch||'Các lượt chờ nhận')+'</p><table><tr><th>STT</th><th>Mã hồ sơ</th><th>Người nộp</th><th>Người giao / nhận</th><th>Ngày giao</th><th>Nội dung</th></tr>'+rows.map((t,i)=>{const c=DATA.cases.find(c=>c.id===t.caseId);return '<tr><td>'+(i+1)+'</td><td>'+esc(c?.code||t.caseId)+'</td><td>'+esc(c?.name||'')+'</td><td>'+esc(person(t.from))+' / '+esc(person(t.to))+'</td><td>'+esc(t.sentAt)+'</td><td>'+esc(t.note)+'</td></tr>';}).join('')+'</table><p>Người giao __________________ &nbsp;&nbsp; Người nhận __________________</p><small>Bản in không thay thế xác nhận nhận trên hệ thống.</small></html>');win.document.close();win.focus();win.print();}
load();
</script></body></html>
